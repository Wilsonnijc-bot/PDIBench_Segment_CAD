[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deformation-detect-workspace"
version = "0.3.0"
description = "Robot-link and object deformation detection workspace interfaces"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
deformation_detect = "infrastructure.deformation_detect.__main__:main"

[tool.setuptools]
py-modules = ["deformation_detect"]

[tool.setuptools.packages.find]
where = ["."]
include = ["robot*", "object*", "infrastructure.deformation_detect*", "infrastructure.shared*"]
exclude = ["*.results*", "*.archive*", "*.tests*"]

[tool.pytest.ini_options]
testpaths = ["infrastructure/tests", "robot/tests", "robot/experiments/link5_shape_codebook/tests", "robot/experiments/link5_pair_selection_ablation/tests", "object/tests", "object/experiments/rigidity/tests", "robot/experiments/link7_depth_filter_v2/tests", "robot/experiments/link7_tapip3d/tests", "robot/experiments/link5_simple3d/test_simple3d_pair_visibility.py", "infrastructure/archive/simple3d/operations/test_simple3d_shutdown_after_completion.py"]
pythonpath = ["."]
