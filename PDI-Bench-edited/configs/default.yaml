# Model paths
tracker_ckpt: "checkpoints/tracker/scaled_offline.pth"
# Mega-SAM internal weights are hard-coded inside third_party/mega_sam/
# No need to specify mega_sam_ckpt here; the Wrapper resolves internal paths automatically

engine_3d: "mega_sam"

# PDI v2.0 evaluation weights
# w_scale:      epsilon_scale      — whether scale change follows h·Z conservation
# w_trajectory: epsilon_trajectory — whether motion path converges to the correct vanishing point
# w_rigidity:   epsilon_rigidity   — whether the object's 3D rigidity is stable
# w_vp:         epsilon_vp         — whether foreground and scene share the same perspective space (view coupling)
weights:
  w_scale: 0.4
  w_trajectory: 0.4
  w_rigidity: 0.2
  w_vp: 0.0

# Inference settings
device: "cuda"
sampling_rate: 1 # process every N frames (1 = every frame)
save_cache: True

# One query manifest is shared by both multi-object CoTracker modes.
multi_object_tracking:
  grid_size: 10
  background_grid_size: 15
  background_dilation: 5
  max_dimension: 880
  object_query_counts:
    link2: 256
    link3: 192
    link4: 128

# CAD canonicalization is opt-in until a pinned FoundationPose worker archive
# and held-out per-link thresholds are available. It reuses the shared MegaSAM
# RGB-D/K cache and the existing CoTracker query manifest.
cad_canonicalization:
  enabled: false
  auto_run: false
  force_foundation_pose: false
  rigidity_method: legacy-point-pair
  link_names: [link2, link3, link4, link5, link6, link7]
  cad_manifest: configs/sam3-cad-franka.yaml
  foundation_pose_archive: null
  scale_policy: video-global-cad
  registration_iterations: 5
  tracking_iterations: 2
  reregister_interval: 10
  coordinate_validation_samples_per_frame: 64
  mask_erosion_radius: 2
  minimum_anchors: 16
  minimum_pairs: 30
  maximum_pairs: 512
  minimum_scored_frames: 5
  minimum_scored_fraction: 0.60
  pose_quality_threshold: 0.40
  pose_discontinuity: {}
  shape_thresholds: {}

multi_object_replay:
  enabled: true
  view_mode: camera-pov
  fps: 16
  max_mask_points: 12000
  mask_point_size: 2
  anchor_point_size: 28

# MegaSAM reconstruction quality audit (two-layer: math + MLLM)
# When enabled: true, the pipeline runs three math checks on the mega_sam .npz output
# after each evaluation: ground flatness, scale-jump detection, and reprojection residual.
# Optionally calls a vision-language model for semantic audit.
reconstruction_audit:
  enabled: true
  npz_path: null
  max_frames: 60
  mllm:
    enabled: false
    api_key: "" # your api key
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    model: "doubao-seed-2-0-pro-260215"
