name: Publish website

on:
  push:
    branches: [main]
    paths:
      - documentation/website/**
      - documentation/publication/build.py
      - documentation/publication/release.json
      - web-assets/**
      - .github/workflows/publish-website.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website source
        uses: actions/checkout@v7.0.1
      - name: Verify published files
        run: python3 documentation/publication/build.py
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: documentation/website
          include-hidden-files: true
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
